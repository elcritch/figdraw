on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "**"
  release:
    types: [published]


jobs:
  tests:
    if: github.event_name != 'release'
    name: ${{ matrix.os }}-${{ matrix.display }}-${{ matrix.renderer }}-devel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            display: x11
            renderer: opengl
            nimflags: '-d:figdraw.opengl=on -d:figdraw.vulkan=off'
            force_opengl: '1'
          - os: ubuntu-24.04
            display: x11
            renderer: vulkan
            nimflags: '-d:figdraw.opengl=off -d:figdraw.vulkan=on -d:figdraw.vulkanValidation'
            force_opengl: '0'
          - os: ubuntu-24.04
            display: wayland
            renderer: opengl
            nimflags: '-d:figdraw.opengl=on -d:figdraw.vulkan=off'
            force_opengl: '1'
          - os: ubuntu-24.04
            display: wayland
            renderer: vulkan
            nimflags: '-d:figdraw.opengl=off -d:figdraw.vulkan=on -d:figdraw.vulkanValidation'
            force_opengl: '0'
          - os: macos-14
            display: none
            renderer: native
            nimflags: ''
          - os: windows-2022
            display: none
            renderer: opengl
            nimflags: '-d:figdraw.opengl=on -d:figdraw.vulkan=off --passC:-IC:/msys64/mingw64/include/harfbuzz -d:harfbuzzyDynlib=libharfbuzz-0.dll -d:harfbuzzyFribidiDynlib=libfribidi-0.dll'
            force_opengl: '1'
            require_graphics: '1'
            test_exclude: ''
            vulkan_icd: ''
          - os: windows-2022
            display: none
            renderer: vulkan
            nimflags: '-d:figdraw.opengl=off -d:figdraw.vulkan=on -d:figdraw.openglFallback=off --passC:-IC:/msys64/mingw64/include/harfbuzz -d:harfbuzzyDynlib=libharfbuzz-0.dll -d:harfbuzzyFribidiDynlib=libfribidi-0.dll'
            force_opengl: '0'
            require_graphics: '0'
            test_exclude: 'tfigrender_oneframe_screenshot.nim,trender_3d_overlay.nim,trender_extras.nim,trender_image.nim,trender_image_msdf_invert.nim,trender_layers_clip.nim,trender_linear_gradient.nim,trender_rgb_boxes.nim,trender_rgb_boxes_sdf.nim,trender_rgb_boxes_sdf_siwin.nim,trender_text_invert.nim,tsiwin_rect_mask_vulkan.nim'
            vulkan_icd: 'C:/swiftshader/vk_swiftshader_icd.json'
    steps:
    - uses: actions/checkout@v6

    - name: Setup software OpenGL (Mesa)
      if: runner.os == 'Windows'
      uses: ssciwr/setup-mesa-dist-win@v3.0.0
      with:
        version: '26.0.3'
        build-type: 'release-msvc'
        deployment-choice: '1'

    - name: Install Windows text shaping dependencies
      if: runner.os == 'Windows'
      run: |
        C:/msys64/usr/bin/pacman.exe -S --noconfirm --needed \
          mingw-w64-x86_64-harfbuzz \
          mingw-w64-x86_64-fribidi
        echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

    - name: Install Windows software Vulkan (SwiftShader)
      if: runner.os == 'Windows' && matrix.renderer == 'vulkan'
      uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa
      with:
        install_runtime_only: true
        install_swiftshader: true
        swiftshader_destination: 'C:\swiftshader'
        cache: true
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify Windows software Vulkan
      if: runner.os == 'Windows' && matrix.renderer == 'vulkan'
      run: |
        test -f "${{ matrix.vulkan_icd }}"
        test -f C:/swiftshader/vk_swiftshader.dll
        test -f C:/swiftshader/vulkan-1.dll
        MSYS2_ARG_CONV_EXCL='*' C:/Windows/System32/reg.exe QUERY \
          'HKLM\SOFTWARE\Khronos\Vulkan\Drivers'
        echo "C:/swiftshader" >> "$GITHUB_PATH"

    - name: Setup software OpenGL/Vulkan (Mesa) + Xvfb (X11)
      if: runner.os == 'Linux' && matrix.display == 'x11'
      timeout-minutes: 15
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          xvfb \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          mesa-utils \
          vulkan-tools \
          vulkan-validationlayers \
          mesa-vulkan-drivers \
          libvulkan1 \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libegl-mesa0 \
          libgles2

    - name: Setup software OpenGL/Vulkan (Mesa) + Weston (Wayland)
      if: runner.os == 'Linux' && matrix.display == 'wayland'
      timeout-minutes: 15
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          xvfb \
          weston \
          wayland-protocols \
          libwayland-dev \
          libwayland-client0 \
          libwayland-cursor0 \
          libwayland-egl1 \
          libwayland-egl-backend-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          mesa-utils \
          vulkan-tools \
          vulkan-validationlayers \
          mesa-vulkan-drivers \
          libvulkan1 \
          libgl1-mesa-dri \
          libglx-mesa0 \
          libegl-mesa0 \
          libgles2

    - name: Install Linux text shaping dependencies
      if: runner.os == 'Linux'
      timeout-minutes: 5
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          pkg-config \
          libharfbuzz-dev \
          libfribidi-dev
        pkg-config --cflags --libs harfbuzz fribidi gl glesv2 egl

        if [[ "${{ matrix.display }}" == "x11" ]]; then
          pkg-config --cflags --libs x11-xcb xcb xcursor xkbcommon xrender
        elif [[ "${{ matrix.display }}" == "wayland" ]]; then
          pkg-config --cflags --libs wayland-client wayland-egl wayland-egl-backend xkbcommon
        fi

    - name: Vulkan diagnostics
      if: runner.os == 'Linux' && matrix.renderer == 'vulkan'
      run: |
        ls -la /usr/share/vulkan/icd.d || true
        vulkaninfo --summary || true

    - name: Install GrabNim
      run: |
        curl --fail --location --silent --show-error \
          https://codeberg.org/janAkali/grabnim/raw/branch/master/misc/install.sh \
          --output "$RUNNER_TEMP/grabnim-install.sh"
        sh "$RUNNER_TEMP/grabnim-install.sh"
        echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

    - name: Install Nim devel nightly
      if: runner.os != 'Windows'
      env:
        GRABNIM_GITHUB_TOKEN: ${{ github.token }}
      run: |
        grabnim devel
        nim_root="$(grabnim path devel | tr -d '\r\"')"
        "$nim_root/bin/nim" c -d:release --out:"$nim_root/bin/nifler" \
          "$nim_root/dist/nimony/src/nifler/nifler.nim"
        "$nim_root/bin/nim" c -d:release --out:"$nim_root/bin/nifmake" \
          "$nim_root/dist/nimony/src/nifmake/nifmake.nim"
        echo "$nim_root/bin" >> "$GITHUB_PATH"

    - name: Install Nim devel nightly (Windows)
      if: runner.os == 'Windows'
      env:
        GRABNIM_GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
      run: |
        archive="$RUNNER_TEMP/windows_x64.zip"
        extracted="$RUNNER_TEMP/nim-devel-extracted"
        curl --fail --location --silent --show-error \
          https://github.com/nim-lang/nightlies/releases/download/latest-devel/windows_x64.zip \
          --output "$archive"
        digest="$(gh api repos/nim-lang/nightlies/releases/tags/latest-devel \
          --jq '.assets[] | select(.name == "windows_x64.zip") | .digest')"
        printf '%s  %s\n' "${digest#sha256:}" "$archive" | sha256sum --check -
        mkdir -p "$extracted"
        unzip -q "$archive" -d "$extracted"
        grabnim_root="$(cygpath -u "$LOCALAPPDATA")/grabnim"
        mkdir -p "$grabnim_root"
        mv "$extracted"/nim-* "$grabnim_root/nim-devel"
        grabnim devel
        nim_root="$(grabnim path devel | tr -d '\r\"')"
        nim_root="$(cygpath -u "$nim_root")"
        export PATH="/c/msys64/mingw64/bin:$nim_root/bin:$PATH"
        "$nim_root/bin/nim.exe" c -d:release --out:"$nim_root/bin/nifler.exe" \
          "$nim_root/dist/nimony/src/nifler/nifler.nim"
        "$nim_root/bin/nim.exe" c -d:release --out:"$nim_root/bin/nifmake.exe" \
          "$nim_root/dist/nimony/src/nifmake/nifmake.nim"
        cygpath -w "$nim_root/bin" >> "$GITHUB_PATH"
        printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

    - name: Install Atlas
      run: |
        curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash -
        echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

    - name: Atlas version
      run: |
        atlas -v

    - name: Cache packages
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.display }}-${{ matrix.renderer }}-nim-devel-${{ hashFiles('figdraw.nimble') }}

    - name: Nim version
      run: |
        command -v nim
        nim -v

    - name: Install Deps
      run: atlas install -t:8 --features:windy,sdl2,siwin,harfbuzz

    # - name: Build Surfer Examples
    #   if: runner.os == 'Linux' && matrix.display == 'wayland'
    #   run: |
    #     nim c examples/surfer_text.nim
    #     nim c examples/surfer_text_shaping_demo.nim

    - name: Build Tests
      if: runner.os == 'Linux' && matrix.display == 'x11'
      env:
        XDG_SESSION_TYPE: "x11"
        FIGDRAW_REQUIRE_GRAPHICS: "1"
        FIGDRAW_TEST_RENDERER: ${{ matrix.renderer }}
        FIGDRAW_TEST_EXCLUDE: ${{ matrix.test_exclude }}
        FIGDRAW_FORCE_OPENGL: ${{ matrix.force_opengl }}
        NIMFLAGS: ${{ matrix.nimflags }}
        GALLIUM_DRIVER: "llvmpipe"
        LIBGL_ALWAYS_SOFTWARE: "1"
        MESA_GL_VERSION_OVERRIDE: "3.3"
        MESA_GLSL_VERSION_OVERRIDE: "330"
      run: |
        xvfb-run -a nim test
        nim r -d:figdrawTextBackend=harfbuzzy tests/tfontutils.nim

    - name: Build Tests
      if: runner.os == 'Linux' && matrix.display == 'wayland'
      env:
        XDG_SESSION_TYPE: "wayland"
        FIGDRAW_REQUIRE_GRAPHICS: "1"
        WAYLAND_DISPLAY: "wayland-1"
        FIGDRAW_TEST_RENDERER: ${{ matrix.renderer }}
        FIGDRAW_FORCE_OPENGL: ${{ matrix.force_opengl }}
        NIMFLAGS: ${{ matrix.nimflags }}
        GALLIUM_DRIVER: "llvmpipe"
        LIBGL_ALWAYS_SOFTWARE: "1"
        MESA_GL_VERSION_OVERRIDE: "3.3"
        MESA_GLSL_VERSION_OVERRIDE: "330"
        VK_ICD_FILENAMES: "/usr/share/vulkan/icd.d/lvp_icd.json"
        VK_DRIVER_FILES: "/usr/share/vulkan/icd.d/lvp_icd.json"
      run: |
        export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
        mkdir -p "${XDG_RUNTIME_DIR}"
        chmod 700 "${XDG_RUNTIME_DIR}"

        weston --backend=headless-backend.so \
               --renderer=pixman \
               --socket="${WAYLAND_DISPLAY}" \
               --idle-time=0 \
               --log="${RUNNER_TEMP}/weston.log" &
        WESTON_PID=$!
        trap 'kill ${WESTON_PID} || true; wait ${WESTON_PID} || true' EXIT

        for _ in $(seq 1 50); do
          if [[ -S "${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}" ]]; then
            break
          fi
          sleep 0.1
        done
        [[ -S "${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}" ]] || (cat "${RUNNER_TEMP}/weston.log" && exit 1)

        if [[ "${{ matrix.renderer }}" == "vulkan" ]]; then
          vulkaninfo --summary || true
        fi
        xvfb-run -a nim test
        nim r -d:figdrawTextBackend=harfbuzzy tests/tfontutils.nim

    - name: Build Tests
      if: runner.os == 'macOS'
      run: |
        nim test

    - name: Build Tests
      if: runner.os == 'Windows'
      env:
        NIMFLAGS: ${{ matrix.nimflags }}
        FIGDRAW_TEST_RENDERER: ${{ matrix.renderer }}
        FIGDRAW_TEST_EXCLUDE: ${{ matrix.test_exclude }}
        FIGDRAW_FORCE_OPENGL: ${{ matrix.force_opengl }}
        FIGDRAW_REQUIRE_GRAPHICS: ${{ matrix.require_graphics }}
        GALLIUM_DRIVER: 'llvmpipe'
        LIBGL_ALWAYS_SOFTWARE: '1'
        VK_ICD_FILENAMES: ${{ matrix.vulkan_icd }}
        VK_DRIVER_FILES: ${{ matrix.vulkan_icd }}
      run: |
        read -r -a nim_flags <<< "$NIMFLAGS"
        nim test
        nim r "${nim_flags[@]}" -d:figdrawTextBackend=harfbuzzy tests/tfontutils.nim

    - name: Run Windows Vulkan graphics tests
      if: runner.os == 'Windows' && matrix.renderer == 'vulkan'
      env:
        NIMFLAGS: ${{ matrix.nimflags }}
        FIGDRAW_TEST_RENDERER: ${{ matrix.renderer }}
        FIGDRAW_FORCE_OPENGL: ${{ matrix.force_opengl }}
        FIGDRAW_REQUIRE_GRAPHICS: '1'
        VK_ICD_FILENAMES: ${{ matrix.vulkan_icd }}
        VK_DRIVER_FILES: ${{ matrix.vulkan_icd }}
      run: |
        read -r -a nim_flags <<< "$NIMFLAGS"
        nim r "${nim_flags[@]}" tests/trender_image_msdf_invert.nim

    - name: Upload Test Output (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: tests-output-${{ runner.os }}-${{ matrix.display }}-${{ matrix.renderer }}-nim-devel
        path: |
          tests/output/
          ${{ runner.temp }}/weston.log
        if-no-files-found: ignore

  native-dynlib-release:
    if: github.event_name == 'release'
    name: native-dynlib-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            library: libfigdraw_native.dylib
          - os: ubuntu-24.04
            platform: linux-x64
            library: libfigdraw_native.so
          - os: windows-2022
            platform: windows-x64
            library: libfigdraw_native.dll
    steps:
    - uses: actions/checkout@v6

    - name: Install Linux native dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          pkg-config \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcursor-dev \
          libxkbcommon-dev \
          libxrender-dev \
          libwayland-dev \
          libwayland-egl-backend-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libvulkan-dev

    - name: Install GrabNim
      run: |
        curl --fail --location --silent --show-error \
          https://codeberg.org/janAkali/grabnim/raw/branch/master/misc/install.sh \
          --output "$RUNNER_TEMP/grabnim-install.sh"
        sh "$RUNNER_TEMP/grabnim-install.sh"
        echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

    - name: Install Nim devel nightly
      if: runner.os != 'Windows'
      env:
        GRABNIM_GITHUB_TOKEN: ${{ github.token }}
      run: |
        grabnim devel
        nim_root="$(grabnim path devel | tr -d '\r\"')"
        "$nim_root/bin/nim" c -d:release --out:"$nim_root/bin/nifler" \
          "$nim_root/dist/nimony/src/nifler/nifler.nim"
        "$nim_root/bin/nim" c -d:release --out:"$nim_root/bin/nifmake" \
          "$nim_root/dist/nimony/src/nifmake/nifmake.nim"
        echo "$nim_root/bin" >> "$GITHUB_PATH"

    - name: Install Nim devel nightly (Windows)
      if: runner.os == 'Windows'
      env:
        GRABNIM_GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
      run: |
        archive="$RUNNER_TEMP/windows_x64.zip"
        extracted="$RUNNER_TEMP/nim-devel-extracted"
        curl --fail --location --silent --show-error \
          https://github.com/nim-lang/nightlies/releases/download/latest-devel/windows_x64.zip \
          --output "$archive"
        digest="$(gh api repos/nim-lang/nightlies/releases/tags/latest-devel \
          --jq '.assets[] | select(.name == "windows_x64.zip") | .digest')"
        printf '%s  %s\n' "${digest#sha256:}" "$archive" | sha256sum --check -
        mkdir -p "$extracted"
        unzip -q "$archive" -d "$extracted"
        grabnim_root="$(cygpath -u "$LOCALAPPDATA")/grabnim"
        mkdir -p "$grabnim_root"
        mv "$extracted"/nim-* "$grabnim_root/nim-devel"
        grabnim devel
        nim_root="$(grabnim path devel | tr -d '\r\"')"
        nim_root="$(cygpath -u "$nim_root")"
        export PATH="/c/msys64/mingw64/bin:$nim_root/bin:$PATH"
        "$nim_root/bin/nim.exe" c -d:release --out:"$nim_root/bin/nifler.exe" \
          "$nim_root/dist/nimony/src/nifler/nifler.nim"
        "$nim_root/bin/nim.exe" c -d:release --out:"$nim_root/bin/nifmake.exe" \
          "$nim_root/dist/nimony/src/nifmake/nifmake.nim"
        cygpath -w "$nim_root/bin" >> "$GITHUB_PATH"
        printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

    - name: Install Atlas
      run: |
        curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash -
        echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

    - name: Install native build dependencies
      run: atlas install --features:siwin,sharedlib

    - name: Build and stage native dynamic library
      run: nim native_dynlib

    - name: Package native dynamic library
      run: |
        package="figdraw-native-${{ matrix.platform }}"
        mkdir -p "release/$package"
        cp "bin/${{ matrix.library }}" "release/$package/"
        cp bin/figdraw_native_abi.nim "release/$package/"
        tar -czf "release/$package.tar.gz" -C release "$package"

    - name: Upload native release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "$GITHUB_REF_NAME" \
          "bin/${{ matrix.library }}" \
          "release/figdraw-native-${{ matrix.platform }}.tar.gz" \
          --clobber
